version: '3.8'

services:
  # --- Users Service ---
  users-service:
    image: users-service:1.0
    networks:
      - micro-net
    environment:
      PORT: "3001"
      MONGODB_URI: "${MONGODB_URI}"
      JWT_SECRET: "${JWT_SECRET}"
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # --- Movies Service ---
  movies-service:
    image: movies-service:1.0
    networks:
      - micro-net
    environment:
      PORT: "3002"
      MONGODB_URI: "${MONGODB_URI}"
      JWT_SECRET: "${JWT_SECRET}"
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # --- Playlists Service ---
  playlists-service:
    image: playlists-service:1.0
    networks:
      - micro-net
    environment:
      PORT: "3003"
      MONGODB_URI: "${MONGODB_URI}"
      JWT_SECRET: "${JWT_SECRET}"
      # Mantém-se a comunicação interna entre containers
      MOVIES_SERVICE_URL: "http://api-gateway/api/movies"
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # --- Products Service ---
  products-service:
    image: products-service:1.0
    networks:
      - micro-net
    environment:
      PORT: "3004"
      MONGODB_URI: "${MONGODB_URI}"
      JWT_SECRET: "${JWT_SECRET}"
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # --- API Gateway ---
  api-gateway:
    image: api-gateway:1.0
    ports:
      - "80:80"
    networks:
      - micro-net
    deploy:
      replicas: 1
      #mode: global
    depends_on:
      - users-service
      - movies-service
      - playlists-service
      - products-service

networks:
  micro-net:
    external: true