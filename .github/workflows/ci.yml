name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-nodejs-services:
    name: Test Node.js Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [movies, playlists, users]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and run tests
        run: |
          cd ${{ matrix.service }}
          npm install
          npm test

  test-python-service:
    name: Test Python Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and run tests
        run: |
          cd products
          pip install -r requirements.txt
          pytest

  build-docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-nodejs-services, test-python-service]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [api-gateway, movies, playlists, products, users]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container images
        run: |
          cd ${{ matrix.service }}
          # The image is built but not pushed to a registry in this CI step
          docker build -t cinemasapp-${{ matrix.service }}:latest .